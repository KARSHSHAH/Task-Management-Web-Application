services:
  - type: web
    name: taskflow-app
    env: node
    buildCommand: "npm ci --prefix server && npm ci --prefix client && npm run build --prefix client"
    startCommand: "npm start --prefix server"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
